apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base # This now includes frontend-service and api-service directories

namespace: guestbook-dev

# Patches to rename the placeholder namespace to the environment-specific one
patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: guestbook-dev
  target:
    kind: Namespace
    name: guestbook-placeholder

images:
  # Kargo will update these tags during promotion
  - name: ghcr.io/alkimake/frontend-service # This must match the image name in base/frontend-service/deployment.yaml
    newName: ghcr.io/alkimake/frontend-service # personalize.sh will change 'alkimake'
    newTag: dev-initial # Placeholder, Kargo will manage this
  - name: ghcr.io/alkimake/api-service # This must match the image name in base/api-service/deployment.yaml
    newName: ghcr.io/alkimake/api-service # personalize.sh will change 'alkimake'
    newTag: dev-initial # Placeholder, Kargo will manage this
  # Keep original guestbook image for now, will be removed once fully transitioned
  - name: ghcr.io/alkimake/guestbook
    newName: ghcr.io/alkimake/guestbook
    newTag: dev-initial


